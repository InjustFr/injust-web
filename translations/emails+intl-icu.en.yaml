        general: 'General'
        lessons: 'Lessons'
        production: 'Production'
        beats: 'Beats'
    notification:
        subject: 'New message from {name} ({topic})'
        intro: '{name} <{email}> wrote through the contact form.'
        topic: 'Topic: {topic}'
        offer: 'Offer: {offer}'
        language: 'Language: {locale, select, fr {French} other {English}}'
        reply: 'Reply to this email to answer them directly.'
