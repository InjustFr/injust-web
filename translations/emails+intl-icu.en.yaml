sales:
    date_format: 'Y-m-d'
    withdrawal_acknowledgement:
        subject: 'Injust: your withdrawal from order {reference} is received'
        greeting: 'Hi,'
        greeting_name: 'Hi {name},'
        received: 'I received your withdrawal on {date} at {time} (Paris time).'
        order: 'The order concerned:'
        paid_on: 'Paid on: {date}'
        message: 'Your message: {reason}'
        next: 'What happens next'
        refund: 'You will be refunded within 14 days of this date, with the same payment method as the original payment, at no cost to you.'
        pro_rata: 'If the service had already started at your request, the refund is reduced by an amount proportional to the service already provided until your withdrawal.'
        credit_note: 'You will receive a credit note by email once the refund is made.'
        keep: 'Keep this email: it is the acknowledgement of your withdrawal on a durable medium.'
        signature: 'Injust'
    withdrawal_notice:
        subject: 'Withdrawal: order {reference} ({product})'
        intro: 'A customer withdrew from an order through the website.'
        received: 'Received on {date} at {time} (Paris time).'
        customer: 'Customer: {email}'
        customer_named: 'Customer: {name} <{email}>'
        message: 'Message: {reason}'
        refund: 'Refund it within 14 days of the receipt, pro-rata if the service had started, from the Orders page of the admin. The credit note is issued when Stripe confirms the refund.'
        reply: 'Reply to this email to write to the customer.'
    credit_note:
        subject: 'Injust: credit note {number} for your order {reference}'
        refunded: 'Your refund of {amount, number, :: currency/EUR} for order {reference} has been made.'
        delay: 'It will reach your account within 5 to 10 days, depending on your bank.'
        reason: 'Reason: {reason}'
        attachment: 'Attached is credit note {number}, which relates to invoice {invoice}.'
    confirmation:
        subject: 'Injust: your order {reference} is confirmed'
        greeting: 'Hi,'
        intro: 'Thanks for your order, the payment has been received. Here is a summary.'
        reference: 'Reference: {reference}'
        product: 'Product: {product}'
        price: 'Price: {amount, number, :: currency/EUR} incl. tax'
        date: 'Date: {date} (Paris time)'
        consents: 'You accepted:'
        consent: '“{text}” accepted on {date} (Paris time)'
        next: 'What happens next'
        booking: 'Pick your slot here:'
        contact_soon: 'I will contact you by email within 2 working days to plan the next steps together.'
        withdrawal_title: 'Right of withdrawal'
        withdrawal: 'You have 14 days from the payment to withdraw, that is until {date} included.'
        pro_rata: 'Since you asked the service to start before the end of this period, if you withdraw after it has started you will pay an amount proportional to the service already provided.'
        how_to_withdraw: 'To withdraw, use the online form “Withdraw from a contract here” with the reference {reference}:'
        or_email: 'You can also send a clear statement by email to {email}.'
        digital_waiver: 'You expressly agreed that the digital content is supplied right after the payment and acknowledged that you thereby waive your right of withdrawal (article L221-28 13° of the French Consumer Code).'
        mediator: 'In case of a dispute, you can turn to the consumer mediator free of charge: {name} – {url}'
        attachments: 'Your invoice and the terms of sale you accepted are attached.'
        signature: 'Injust'
