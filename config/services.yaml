parameters:
    env(ASSETS_DIR): build
    brand: 'Injust'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Infrastructure\Platforms\YoutubeFinder:
        autoconfigure: false
        arguments: { $platform: !php/enum App\Domain\Music\Platform::YoutubeMusic }
        tags: [{ name: App\Application\Music\PlatformFinder, priority: 5 }]

    app.platforms.youtube_finder:
        class: App\Infrastructure\Platforms\YoutubeFinder
        autoconfigure: false
        arguments: { $platform: !php/enum App\Domain\Music\Platform::Youtube }
        tags: [{ name: App\Application\Music\PlatformFinder, priority: 4 }]

    Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler:
        arguments:
            - !service { class: PDO, factory: ['@doctrine.dbal.default_connection', 'getNativeConnection'] }
            - { lock_mode: !php/const Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler::LOCK_NONE }

when@test:
    services:
        App\Tests\Support\EndToEndSessionStorageFactory:
            arguments:
                $mock: '@session.storage.factory.mock_file'
                $native: '@session.storage.factory.native'
                $useNative: '%env(bool:default::E2E_NATIVE_SESSIONS)%'

        App\Tests\Support\FakeAccounts:
            decorates: http_client
            arguments: ['@.inner']

        App\Tests\Support\FakeYoutube:
            decorates: http_client
            arguments: ['@.inner']

        App\Tests\Support\FakePlatforms: &fake_platforms
            decorates: http_client
            arguments: ['@.inner']

        App\Tests\Support\Payments\FakeStripe: &fake_stripe
            decorates: http_client
            arguments:
                $client: '@.inner'
                $sessions: !service { class: Symfony\Component\Cache\Adapter\FilesystemAdapter, arguments: ['fake_stripe', 0, '%kernel.cache_dir%'] }
                $clock: '@clock'
                $kernel: '@http_kernel'
                $signature: '@App\Presentation\Web\Webhooks\StripeSignature'

when@dev:
    services:
        App\Tests\Support\Payments\FakeStripe: *fake_stripe
        App\Tests\Support\FakePlatforms: *fake_platforms
