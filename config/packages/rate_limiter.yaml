framework:
    cache:
        pools:
            cache.contact_limiter:
                adapter: cache.adapter.filesystem
            cache.checkout_limiter:
                adapter: cache.adapter.filesystem
            cache.withdrawal_limiter:
                adapter: cache.adapter.filesystem
    rate_limiter:
        contact:
            policy: sliding_window
            limit: 5
            interval: '10 minutes'
            cache_pool: cache.contact_limiter
            lock_factory: lock.factory
        contact_recipient:
            policy: fixed_window
            limit: 3
            interval: '1 day'
            cache_pool: cache.contact_limiter
            lock_factory: lock.factory
        contact_acknowledgement:
            policy: fixed_window
            limit: 100
            interval: '1 day'
            cache_pool: cache.contact_limiter
            lock_factory: lock.factory
        checkout:
            policy: sliding_window
            limit: 10
            interval: '10 minutes'
            cache_pool: cache.checkout_limiter
            lock_factory: lock.factory
        withdrawal:
            policy: sliding_window
            limit: 5
            interval: '10 minutes'
            cache_pool: cache.withdrawal_limiter
            lock_factory: lock.factory
